<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文章思维导图 · 交互原型</title>
<style>
:root{--paper:#fffaf1;--bg:#fbf7ee;--ink:#151511;--accent:#ff541f;--wash:#fff0d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Noto Sans SC','Microsoft YaHei',sans-serif}body.dark{--paper:#292c27;--bg:#20221f;--ink:#fff6e5;--wash:#39322a}button,input,select{font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}button:hover{background:var(--wash)}button:active{transform:translate(1px,1px)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:#151511;box-shadow:2px 3px 0 var(--ink);font-weight:750}header{border-bottom:2px solid var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:14px;padding:15px 24px;background:var(--paper)}header strong{font-size:20px}header small{color:var(--accent)}.spacer{flex:1}.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px;border-bottom:1.5px solid var(--ink)}.canvas{position:relative;min-height:calc(100dvh - 225px);overflow:auto;display:grid;place-items:center;padding:50px 28px}.tree{display:flex;align-items:center;gap:58px;min-width:680px}.root,.node{border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:14px 18px;position:relative;min-width:180px;box-shadow:3px 4px 0 var(--ink)}.root{background:var(--accent);color:#151511;font-size:23px;font-weight:850;padding:25px}.branches{display:grid;gap:22px;border-left:2px solid var(--ink);padding:18px 0 18px 40px}.node:before{content:'';position:absolute;left:-42px;top:50%;width:40px;border-top:2px solid var(--ink)}.node.selected{outline:3px solid var(--accent);outline-offset:3px}.node .jump{float:right;margin-left:18px;padding:0 6px}.node small{display:block;color:var(--accent)}footer{position:fixed;bottom:0;left:0;right:0;border-top:2px solid var(--ink);background:var(--paper);padding:12px 24px;display:flex;align-items:center;gap:8px}.panel{position:fixed;right:18px;top:140px;bottom:74px;width:345px;padding:22px;background:var(--paper);border:2px solid var(--ink);border-radius:16px;box-shadow:5px 6px 0 var(--accent);overflow:auto;z-index:10}.panel h2{margin:0 0 15px;font-size:21px}.panel label{display:block;margin:16px 0}.panel input{width:100%}.panel .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.notice{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);padding:10px 18px;border:2px solid var(--ink);background:var(--paper);border-radius:10px;box-shadow:3px 4px 0 var(--accent);z-index:20}.article{max-width:850px;margin:34px auto;padding:28px;border:2px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:5px 6px 0 var(--accent)}.card{margin:25px 0;border:2px solid var(--ink);padding:22px;border-radius:12px;background:var(--wash)}.demo{padding:6px 24px;font-size:12px;border-bottom:1px solid var(--ink)}[hidden]{display:none!important}@media(max-width:650px){header,.toolbar,footer{padding:12px}.panel{inset:145px 12px 72px;width:auto}.canvas{justify-content:start}.article{margin:15px;padding:20px}.tree{gap:30px}.node{min-width:160px}}
</style>
<div class="demo">交互原型 · 示例内容与 AI 结果为演示，可切换首次创建、卡片引用、失败及移动端状态。</div>
<header><button onclick="showArticle()">原文 ↗</button><strong>线性表与链表</strong><span id="state">已保存</span><span class="spacer"></span><button class="primary" onclick="panel('ai')">AI 生成</button><button onclick="notify('原型演示：导出 PNG / SVG / 大纲 / JSON')">导出 ▾</button><button onclick="document.body.classList.toggle('dark')">明暗</button></header>
<div class="toolbar"><button onclick="notify('撤销上一次操作')">↶ 撤销</button><button onclick="notify('重做上一次操作')">↷ 重做</button><button onclick="addNode('新主题')">＋ 主题</button><button onclick="notify('布局：思维导图、逻辑图、树形图、组织结构图')">布局 ▾</button><button onclick="panel('props')">属性</button><button onclick="panel('help')">快捷键</button><select onchange="scenario(this.value)"><option value="existing">已有导图</option><option value="empty">首次创建</option><option value="failure">保存失败</option><option value="broken">失效引用</option></select></div>
<main class="canvas" id="canvas"><div class="tree"><div class="root">线性表与链表</div><div class="branches" id="branches"><div class="node" onclick="select(this)">顺序存储 <button class="jump" onclick="event.stopPropagation();showArticle()" aria-label="跳转原文">↗</button></div><div class="node" onclick="select(this)"><small>引用卡片</small><span>头插法的操作步骤</span><button class="jump" onclick="event.stopPropagation();showArticle()" aria-label="跳转原文">↗</button></div><div class="node" onclick="select(this)">复杂度比较 <button class="jump" onclick="event.stopPropagation();showArticle()">↗</button></div></div></div></main>
<section class="article" id="article" hidden><h1>线性表与链表 <button onclick="showMap()">思维导图</button></h1><p>用图梳理关系，用文章保留完整知识。</p><div class="card" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','头插法的操作步骤')"><strong>头插法的操作步骤</strong><button onclick="addNode('头插法的操作步骤');showMap()">＋ 加入导图</button><p>创建新节点，将新节点指向原来的第一个节点，再让头节点指向新节点。</p><small>通过右上角手柄拖入导图；正文仍可选字和复制。</small></div><button onclick="showMap()">返回导图</button></section>
<aside class="panel" id="panel" hidden></aside><div class="notice" id="notice" hidden></div>
<footer><span id="selected">单击节点选中，点击 ↗ 查看原文</span><span class="spacer"></span><button onclick="notify('缩小画布')">－</button><span>100%</span><button onclick="notify('放大画布')">＋</button><button onclick="notify('适应当前窗口')">适应</button></footer>
<script>
let selected=null;function notify(text){notice.textContent=text;notice.hidden=false;setTimeout(()=>notice.hidden=true,2400)}function showArticle(){canvas.hidden=true;article.hidden=false;document.getElementById('panel').hidden=true}function showMap(){canvas.hidden=false;article.hidden=true}function select(node){selected?.classList.remove('selected');selected=node;node.classList.add('selected');document.getElementById('selected').textContent='已选中：'+node.textContent.replace('↗','').trim()}function addNode(text){branches.hidden=false;const el=document.createElement('div');el.className='node';el.textContent=text;el.onclick=()=>select(el);branches.append(el);select(el);notify('已加入，可双击或在属性中改名')}function panel(type){const el=document.getElementById('panel');el.hidden=false;el.innerHTML=type==='ai'?'<h2>AI 生成预览</h2><p>使用博客已配置的文字模型</p><p>范围：整篇文章的标题、重点、卡片与引用块</p><div class="card">AI 整理<br>├ 顺序存储<br>├ 链式存储<br>└ 头插法的操作步骤 ↗</div><p>已有节点保留，新增结果可整体撤销。</p><div class="actions"><button onclick="closePanel()">取消</button><button onclick="notify(\'重新生成预览\')">重新生成</button><button class="primary" onclick="addNode(\'AI 整理\');closePanel()">作为新分支加入</button></div>':type==='help'?'<h2>常用快捷键</h2><p>Enter 同级 · Tab 子级<br>Ctrl+Enter 父主题<br>F2 改名 · Delete 删除<br>Ctrl+Z 撤销<br>Ctrl+Shift+Z 重做<br>Ctrl+/ 折叠</p><button onclick="closePanel()">关闭</button>':'<h2>节点属性</h2><label>名称<input id="name" value="'+(selected?.querySelector('span')?.textContent||'头插法的操作步骤')+'"></label><label>备注<input placeholder="补充自己的理解"></label><p>来源：线性表与链表 / 链式存储</p><button onclick="showArticle()">查看原文 ↗</button><div class="actions"><button onclick="closePanel()">关闭</button><button class="primary" onclick="rename()">保存名称</button></div>'}function closePanel(){document.getElementById('panel').hidden=true}function rename(){if(selected){const span=selected.querySelector('span');if(span)span.textContent=document.getElementById('name').value;else selected.childNodes[0].textContent=document.getElementById('name').value}closePanel();notify('已改名，原文链接保留')}function scenario(value){showMap();state.textContent=value==='failure'?'保存失败 · 修改已暂存':'已保存';if(value==='empty'){branches.hidden=true;notify('根节点已创建，可手动编辑或 AI 生成')}else{branches.hidden=false;if(value==='broken'){notify('引用已失效，请重新关联');panel('props')}}}canvas.ondragover=e=>e.preventDefault();canvas.ondrop=e=>{e.preventDefault();addNode(e.dataTransfer.getData('text/plain')||'引用卡片')};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
</script></html>
