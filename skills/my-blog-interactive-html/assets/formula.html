<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>平方函数</title>
<style>body{font:16px/1.6 system-ui}section{border:2px solid var(--ink,#222);padding:16px;box-shadow:4px 4px var(--ink,#222)}input{width:100%;accent-color:var(--accent,#ff5a1f)}output{font-size:24px}svg{width:100%;height:auto;max-width:500px;border:1px solid var(--ink,#222)}text{fill:var(--ink,#222)}button{min-height:36px;border:1px solid var(--ink,#222);background:var(--paper,#fbf7ee);color:var(--ink,#222)}</style></head>
<body><section><h2>平方函数 y = x²</h2><label for="x">自变量 x（−5 到 5，步长 0.1，无单位）</label><input id="x" type="range" min="-5" max="5" step="0.1" value="2"><p><output id="result" aria-live="polite"></output></p><svg viewBox="0 0 320 190" role="img" aria-label="平方函数图像，横轴 x，纵轴 y"><path d="M10 170 H310 M160 180 V10" fill="none" stroke="currentColor"/><polyline id="curve" fill="none" stroke="#ff5a1f" stroke-width="2"/><circle id="point" r="5" fill="currentColor"/><text x="295" y="186">x</text><text x="165" y="15">y</text></svg><p>正数与其相反数的平方相同；绝对值越大，平方越大。</p><button id="reset">重置</button></section>
<script>const input=document.querySelector('#x'),point=document.querySelector('#point');document.querySelector('#curve').setAttribute('points',Array.from({length:101},(_,i)=>{const x=-5+i/10;return (160+x*28)+','+(170-x*x*6);}).join(' '));function update(){const x=Number(input.value),y=x*x;document.querySelector('#result').textContent='x = '+x.toFixed(1)+'，y = '+y.toFixed(2);point.setAttribute('cx',160+x*28);point.setAttribute('cy',170-y*6);}input.oninput=update;document.querySelector('#reset').onclick=()=>{input.value='2';update();};update();</script></body></html>
