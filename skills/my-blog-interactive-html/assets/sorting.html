<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>冒泡排序</title>
<style>body{font:16px/1.6 system-ui}section{border:2px solid var(--ink,#222);padding:16px;box-shadow:4px 4px var(--ink,#222)}#bars{display:flex;align-items:end;gap:8px;height:160px;margin:16px 0}.bar{flex:1;background:var(--accent,#ff5a1f);border:2px solid var(--ink,#222);text-align:center;min-width:0}button{min-height:36px;padding:6px;border:1px solid var(--ink,#222);background:var(--paper,#fbf7ee);color:var(--ink,#222)}.active{outline:3px solid var(--ink,#222);outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px}</style></head>
<body><section><h2>冒泡排序：相邻比较</h2><p>较大的数向右交换，每轮末尾确定一个最大值。</p><div id="bars" aria-label="当前数组"></div><p id="status" aria-live="polite"></p><div class="actions"><button id="play">播放</button><button id="pause">暂停</button><button id="step">单步</button><button id="reset">重置</button></div></section>
<script>
const initial=[5,2,4,1,3];let values=[...initial],i=0,end=4,timer=null,compares=0;
const bars=document.querySelector('#bars'),status=document.querySelector('#status');
function draw(){bars.replaceChildren(...values.map((value,index)=>{const bar=document.createElement('div');bar.className='bar'+(end>0&&(index===i||index===i+1)?' active':'');bar.style.height=(value*25)+'px';bar.textContent=value;return bar;}));}
function pause(){clearInterval(timer);timer=null;}
function step(){if(end===0){pause();return;}const pair=[values[i],values[i+1]];const swapped=values[i]>values[i+1];if(swapped)[values[i],values[i+1]]=[values[i+1],values[i]];compares++;i++;if(i===end){end--;i=0;}status.textContent=end===0?'排序完成，共比较 '+compares+' 次。':'比较 '+pair.join(' 与 ')+(swapped?'，交换位置。':'，保持位置。');draw();if(end===0)pause();}
document.querySelector('#play').onclick=()=>{if(!timer&&end>0)timer=setInterval(step,matchMedia('(prefers-reduced-motion: reduce)').matches?1000:700);};
document.querySelector('#pause').onclick=pause;document.querySelector('#step').onclick=()=>{pause();step();};document.querySelector('#reset').onclick=()=>{pause();values=[...initial];i=0;end=4;compares=0;status.textContent='初始数组，点击单步开始。';draw();};
addEventListener('byqx:visibility',event=>{if(!event.detail.visible)pause();});document.querySelector('#reset').click();
</script></body></html>
