name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        default: v1.1.4
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BYQX_DESKTOP_DIST_DIR: .diag/windows-release-dist
      TZ: Asia/Shanghai
      HARNESS_REF: ${{ github.sha }}
    steps:
      - name: Preserve repository fixture line endings
        shell: pwsh
        run: |
          function rtk { $program=$args[0]; $argv=@($args | Select-Object -Skip 1); & $program @argv; if($LASTEXITCODE -ne 0) { throw "$program failed: $LASTEXITCODE" } }
          rtk git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - name: Build and verify Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function rtk { $program=$args[0]; $argv=@($args | Select-Object -Skip 1); & $program @argv; if($LASTEXITCODE -ne 0) { throw "$program failed: $LASTEXITCODE" } }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version differ' }
          rtk pnpm install --frozen-lockfile --fetch-timeout=600000 --fetch-retries=3
          rtk node node_modules/electron/install.js
          rtk pnpm check
          rtk git fetch --no-tags --depth=1 origin $env:HARNESS_REF
          rtk node --input-type=module -e "import fs from 'node:fs'; import {execFileSync} from 'node:child_process'; for(const file of ['scripts/verify-editor-portable.mjs','scripts/verify-deployment-fixes.mjs']) fs.writeFileSync(file,execFileSync('git',['show',process.env.HARNESS_REF+':'+file]));"
          rtk pnpm run desktop:template
          $unitDb = Join-Path (Get-Location).Path '.diag/ci-unit.db'
          Copy-Item -LiteralPath desktop/assets/template.db -Destination $unitDb
          $env:DATABASE_URL = "file:$unitDb"
          try { rtk pnpm test } finally { Remove-Item Env:DATABASE_URL }
          rtk pnpm run build:portable -- --target windows-release
          rtk node scripts/verify-editor-portable.mjs windows-release
          rtk node scripts/verify-deployment-fixes.mjs windows-release
          $workspace = (Get-Location).Path
          $portable = (Resolve-Path release/windows-release).Path
          if (-not $portable.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar)) { throw 'Invalid portable path' }
          $assets = Join-Path $workspace 'release/assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          $marker = Join-Path $portable 'resources/desktop-assets/portable.marker'
          $markerContent = Get-Content -LiteralPath $marker -Raw
          Remove-Item -LiteralPath $marker
          try {
            rtk pnpm exec electron-builder --win nsis --x64 --prepackaged $portable --config desktop-builder.yml --config.directories.output=release/assets --publish never
          } finally { [IO.File]::WriteAllText($marker, $markerContent) }
          $zip = Join-Path $assets "My-Blog-$version-Windows-x64-Portable.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory($portable, $zip, [IO.Compression.CompressionLevel]::Optimal, $true)
          $files = @("My-Blog-$version-Windows-x64-Setup.exe", "My-Blog-$version-Windows-x64-Portable.zip")
          $checksums = foreach ($name in $files) { "$((Get-FileHash -LiteralPath (Join-Path $assets $name) -Algorithm SHA256).Hash.ToLowerInvariant())  $name" }
          [IO.File]::WriteAllText((Join-Path $assets 'SHA256SUMS.txt'), ($checksums -join "`n") + "`n")
      - name: Publish latest Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function rtk { $program=$args[0]; $argv=@($args | Select-Object -Skip 1); & $program @argv; if($LASTEXITCODE -ne 0) { throw "$program failed: $LASTEXITCODE" } }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $release = $null
          try { $release = rtk gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json } catch { }
          if ($release -and -not $release.isDraft) { throw 'Release already published; refusing to replace it' }
          if (-not $release) { rtk gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "$($env:RELEASE_TAG) · Windows 桌面版" --notes-file "docs/releases/$($env:RELEASE_TAG).md" }
          rtk gh release upload $env:RELEASE_TAG "release/assets/My-Blog-$version-Windows-x64-Setup.exe" "release/assets/My-Blog-$version-Windows-x64-Portable.zip" release/assets/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          rtk gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest --title "$($env:RELEASE_TAG) · Windows 桌面版" --notes-file "docs/releases/$($env:RELEASE_TAG).md"
